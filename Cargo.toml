[package]
name = "dvarogue"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking", "debug"] }
rand = "=0.10.1"
ron = "0.12.1"
serde = "1.0.0"
serde_core = "1.0.0"
thiserror = { version = "1.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
